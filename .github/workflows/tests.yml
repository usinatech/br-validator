name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.2"
            illuminate: "^11.0"
            testbench: "^9.0"
            phpunit: "^10.5"
          - php: "8.2"
            illuminate: "^12.0"
            testbench: "^10.0"
            phpunit: "^11.5"
          - php: "8.3"
            illuminate: "^13.0"
            testbench: "^11.0"
            phpunit: "^12.0"

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Pin matrix dependencies
        run: |
          composer require --no-update "illuminate/support:${{ matrix.illuminate }}"
          composer require --dev --no-update "orchestra/testbench:${{ matrix.testbench }}" "phpunit/phpunit:${{ matrix.phpunit }}"

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist --with-all-dependencies

      - name: Validate composer.json
        run: composer validate --no-check-publish --strict

      - name: Run test suite
        run: composer test
